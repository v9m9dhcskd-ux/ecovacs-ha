# Ansicht "Saugroboter" für ein bestehendes Dashboard (nur Standard-Karten)
#
# Einfügen:
#   Dashboard öffnen → Stift (Bearbeiten) → "+" neben den Ansichten (Ansicht hinzufügen)
#   → ⋮ oben rechts → "In YAML bearbeiten" → alles ersetzen durch diesen Inhalt → Speichern
#
# Anpassen:
#   - Roboter: vacuum.eg_wohnzimmer_putzfrau (für einen anderen per Suchen & Ersetzen ändern)
#   - Raumnamen: Beispielnamen durch die Namen aus der Ecovacs-App ersetzen. Die Namen stehen
#     unter Entwicklerwerkzeuge → Zustände → vacuum.eg_wohnzimmer_putzfrau → Attribut "rooms".
#     Groß-/Kleinschreibung ist egal. Weitere Räume: einen Button-Block kopieren.
#   - Kombinationen: Räume werden in der angegebenen Reihenfolge gereinigt.

title: Saugroboter
path: saugroboter
icon: mdi:robot-vacuum
type: sections
max_columns: 2
sections:
  # ---------------------------------------------------------------- Status
  - type: grid
    cards:
      - type: heading
        heading: Status
        icon: mdi:robot-vacuum

      - type: tile
        entity: vacuum.eg_wohnzimmer_putzfrau
        name: Putzfrau
        grid_options:
          columns: full
        features_position: bottom
        features:
          - type: vacuum-commands
            commands: [start_pause, stop, return_home]

      - type: tile
        entity: sensor.eg_wohnzimmer_putzfrau_aktueller_raum
        name: Aktueller Raum
        icon: mdi:map-marker-radius
      - type: tile
        entity: sensor.eg_wohnzimmer_putzfrau_station
        name: Station

      # Nur sichtbar, wenn der Roboter einen Fehler meldet
      - type: tile
        entity: sensor.eg_wohnzimmer_putzfrau_fehler
        name: Fehler
        icon: mdi:alert-circle
        color: red
        state_content: [state, description]
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: sensor.eg_wohnzimmer_putzfrau_fehler
            state_not: ["0", unknown, unavailable]

  # ----------------------------------------------------------------- Räume
  - type: grid
    cards:
      - type: heading
        heading: Räume
        icon: mdi:floor-plan

      - type: button
        name: Küche
        icon: mdi:silverware-fork-knife
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Küche]
      - type: button
        name: Flur
        icon: mdi:door
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Flur]
      - type: button
        name: Wohnzimmer
        icon: mdi:sofa
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Wohnzimmer]
      - type: button
        name: Bad
        icon: mdi:shower
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Bad]

      - type: heading
        heading: Kombiniert
        heading_style: subtitle
      - type: button
        name: Küche + Flur
        icon: mdi:numeric-2-box-multiple-outline
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Küche, Flur]
      - type: button
        name: Wohnzimmer + Flur
        icon: mdi:numeric-2-box-multiple-outline
        show_state: false
        grid_options:
          columns: 6
          rows: 1
        tap_action:
          action: perform-action
          perform_action: ecovacs_omni.clean_rooms
          target:
            entity_id: vacuum.eg_wohnzimmer_putzfrau
          data:
            rooms: [Wohnzimmer, Flur]
